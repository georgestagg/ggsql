name: Open VSX Release (manual, universal only)

# Releases are driven by release-packages.yml: its build-vsix and
# publish-openvsx jobs build and publish all six VSIXes, five of which carry a
# bundled ggsql-jupyter kernel downloaded from the platform build jobs in the
# same run. This workflow is kept only as a manual path for republishing the
# kernel-less universal VSIX on its own, and deliberately has no tag trigger:
# on a tag it would race the publish in release-packages.yml. Dispatch it
# against a tag rather than a branch — the publish step is still gated on a tag
# ref, so a dispatch from a branch packages the VSIX and stops there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Install dependencies
        working-directory: ggsql-vscode
        run: npm ci

      - name: Package VSIX
        working-directory: ggsql-vscode
        run: vsce package

      - name: Publish to Open VSX Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: HaaLeo/publish-vscode-extension@v2
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          skipDuplicate: true
          packagePath: ggsql-vscode
